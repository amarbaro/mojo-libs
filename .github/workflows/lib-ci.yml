# Shared CI for the amarbaro Mojo libraries: a library's .github/workflows/ci.yml calls this (templates/ci.yml, docs/ci.md).
name: lib-ci
on:
  workflow_call:
    inputs:
      mojo:
        description: "stable = the library's own pin; nightly = a nightly Mojo through MOJO=, only for a scripts/ci.sh that honours it"
        type: string
        default: stable
      apt:
        description: extra apt packages, space separated
        type: string
        default: ""
      pre:
        description: shell command run before scripts/ci.sh
        type: string
        default: ""

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - if: inputs.apt != ''
        run: sudo apt-get update -q && sudo apt-get install -yq ${{ inputs.apt }}
      - if: inputs.mojo == 'nightly'
        shell: bash
        run: |
          grep -q MOJO scripts/ci.sh || { echo "FAIL setup: scripts/ci.sh has no MOJO= override, nightly cannot be selected"; exit 1; }
          uv venv -q "$RUNNER_TEMP/nightly" && uv pip install -q --python "$RUNNER_TEMP/nightly/bin/python" --prerelease allow --index-strategy unsafe-best-match --extra-index-url https://whl.modular.com/nightly/simple/ mojo max
          echo "MOJO=$RUNNER_TEMP/nightly/bin/mojo" >> "$GITHUB_ENV"
      - if: inputs.pre != ''
        run: ${{ inputs.pre }}
      - run: bash scripts/ci.sh 2>&1 | tee ci.log
        shell: bash
      - name: Badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true   # a failed badge write must not turn CI red
        shell: bash
        run: |
          s=$(grep -oE "^(PASS|FAIL) [0-9]+/[0-9]+" ci.log | tail -1 || true)
          if [[ $s =~ ^(PASS|FAIL)\ ([0-9]+)/([0-9]+) ]]; then m=${BASH_REMATCH[3]}; [[ ${BASH_REMATCH[1]} == PASS ]] && p=${BASH_REMATCH[2]} || p=$((m - BASH_REMATCH[2]))
          else p=$(grep -cE "^ok " ci.log || true); m=$((p + $(grep -cE "^(FAIL|not ok)" ci.log || true))); fi
          c=red; ((m > 0 && p == m)) && c=brightgreen
          mkdir -p .b && printf '{"schemaVersion":1,"label":"checks","message":"%s/%s","color":"%s"}\n' $p $m $c > .b/checks.json
          cd .b && git init -q -b badges && git add checks.json && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "checks $p/$m"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges
