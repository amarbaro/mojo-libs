[project]
name = "mojo-uuid"
version = "0.1.0"
description = "UUID for Mojo, byte-identical with CPython 3.14 uuid"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-uuid"
Repository = "https://github.com/amarbaro/mojo-uuid"

[tool.mojo]
packages = ["src/uuid"]
deps = ["mojo-hashlib >=0.1.2,<0.2"]
