[project]
name = "mojo-subprocess"
version = "0.1.2"
description = "Forwarding package: `import subprocess` re-exports posix.subprocess (subprocess.run with Python results) from mojo-posix"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-subprocess"
Repository = "https://github.com/amarbaro/mojo-subprocess"

[tool.mojo]
packages = ["subprocess"]  # ../posix is the sibling library
deps = ["mojo-posix >=0.1.7,<0.2"]
