[project]
name = "mojo-zip"
version = "0.1.0"
description = "zipfile read/write for Mojo: stored + deflate, zip64, CRC, CPython zipfile behaviour"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-zip"
Repository = "https://github.com/amarbaro/mojo-zip"

[dependency-groups]
dev = []

[tool.mojo]
packages = ["zipfile"]  # src/gzip and src/mmap are vendored copies for a clone build; the conda package carries only zipfile
deps = ["mojo-gzip >=0.1.2,<0.2", "mojo-mmap >=0.1.0,<0.2"]
