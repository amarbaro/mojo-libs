[project]
name = "mojo-systemd"
version = "0.1.4"
description = "Forwarding package: `import systemd` re-exports posix.systemd (sd_notify READY, STATUS, WATCHDOG, STOPPING) from mojo-posix"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[tool.mojo]
packages = ["systemd"]  # ../posix is the sibling library
deps = ["mojo-posix >=0.1.7,<0.2"]
